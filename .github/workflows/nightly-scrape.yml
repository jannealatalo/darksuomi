name: Nightly scrape

# Scrapes venue events, tags genres and builds expected setlists, then
# commits the updated data to main. Vercel deploys the commit automatically.

on:
  schedule:
    # 02:00 UTC = 04:00 Finnish winter time / 05:00 summer time.
    # GitHub may start scheduled runs a few minutes late.
    - cron: "0 2 * * *"
  # Lets you run it by hand: Actions tab -> Nightly scrape -> Run workflow.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper-requirements.txt

      - name: Install dependencies
        run: pip install -r scraper-requirements.txt

      - name: Scrape Tavastia
        run: python scraper_advanced.py

      - name: Tavastia doors and stage times
        run: python enrich_tavastia.py

      - name: Scrape On the Rocks
        run: python scraper_rocks.py

      - name: Scrape Lepakkomies
        run: python scraper_lepakkomies.py

      - name: Scrape Kulttuuritalo and KULT
        run: python scraper_kulttuuritalo.py

      - name: Scrape Bar Loose
        run: python scraper_barloose.py

      - name: Scrape Veikkaus Arena (music only)
        run: python scraper_veikkausarena.py

      - name: Scrape Tiivistämö (concerts only)
        run: python scraper_tiivistamo.py

      - name: Scrape Helsingin Jäähalli (concerts only)
        run: python scraper_jaahalli.py

      - name: Scrape Olympiastadion (music only)
        run: python scraper_stadion.py

      - name: Scrape Korjaamo (music only)
        run: python scraper_korjaamo.py

      - name: Scrape Sellosali, Espoo (music only)
        run: python scraper_sellosali.py

      - name: Tuska festival line-up (weekly, on Mondays)
        # Festival line-ups change slowly; a manual run always checks too.
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scraper_tuska.py
          else
            echo "Not Monday; skipping the weekly Tuska check."
          fi

      - name: Tag genres
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python genres.py

      - name: Build expected setlists
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: python setlists.py

      - name: Update Spotify playlists
        # A Spotify problem shouldn't stop the rest of the data from updating.
        continue-on-error: true
        env:
          SPOTIFY_PLAYLIST_CLIENT_ID: ${{ secrets.SPOTIFY_PLAYLIST_CLIENT_ID }}
          SPOTIFY_PLAYLIST_CLIENT_SECRET: ${{ secrets.SPOTIFY_PLAYLIST_CLIENT_SECRET }}
          SPOTIFY_PLAYLIST_REFRESH_TOKEN: ${{ secrets.SPOTIFY_PLAYLIST_REFRESH_TOKEN }}
        run: python playlists.py

      - name: Update band directory links
        # MusicBrainz links (+ Spotify search fallback); not critical.
        continue-on-error: true
        env:
          SPOTIFY_PLAYLIST_CLIENT_ID: ${{ secrets.SPOTIFY_PLAYLIST_CLIENT_ID }}
          SPOTIFY_PLAYLIST_CLIENT_SECRET: ${{ secrets.SPOTIFY_PLAYLIST_CLIENT_SECRET }}
          SPOTIFY_PLAYLIST_REFRESH_TOKEN: ${{ secrets.SPOTIFY_PLAYLIST_REFRESH_TOKEN }}
        run: python bands.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Nightly data update $(date -u +%Y-%m-%d)"
          git push
