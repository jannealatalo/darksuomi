name: Nightly scrape

# Scrapes venue events, tags genres and builds expected setlists, then
# commits the updated data to main. Vercel deploys the commit automatically.

on:
  schedule:
    # Cron is in UTC: 22:15 UTC = 00:15 Finnish winter time (01:15 in
    # summer), so the site has the new day's data right after midnight.
    # GitHub starts busy on-the-hour schedules hours late (09:19 UTC instead
    # of 02:00 in Nov 2026), hence an odd minute, plus a backup start at
    # 01:47 UTC (03:47 Finnish) that only scrapes if the first hasn't run
    # (see the "check" job).
    - cron: "15 22 * * *"
    - cron: "47 1 * * *"
  # Lets you run it by hand: Actions tab -> Nightly scrape -> Run workflow.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-scrape
  cancel-in-progress: false

# The scripts' "today" (date.today(), date) is the Finnish date: at 00:15
# Finnish time it's still yesterday in UTC.
env:
  TZ: Europe/Helsinki

jobs:
  check:
    # A scheduled start is skipped when today's scrape has already run
    # (the backup cron); a manual run always scrapes.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: frontend/data/meta.json
          sparse-checkout-cone-mode: false
      - id: due
        run: |
          last=$(python3 -c "import json; print(json.load(open('frontend/data/meta.json'))['lastScraped'][:10])")
          today=$(date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "Already scraped today ($last); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper-requirements.txt

      - name: Install dependencies
        run: pip install -r scraper-requirements.txt

      # Each venue step may fail on its own (site down, layout changed)
      # without stopping the rest: that venue just keeps yesterday's data.
      - name: Scrape Tavastia
        continue-on-error: true
        run: python scraper_advanced.py

      - name: Tavastia doors and stage times
        continue-on-error: true
        run: python enrich_tavastia.py

      - name: Scrape On the Rocks
        continue-on-error: true
        run: python scraper_rocks.py

      - name: Scrape Lepakkomies
        continue-on-error: true
        run: python scraper_lepakkomies.py

      - name: Scrape Kulttuuritalo and KULT
        continue-on-error: true
        run: python scraper_kulttuuritalo.py

      - name: Scrape Bar Loose
        continue-on-error: true
        run: python scraper_barloose.py

      - name: Scrape Veikkaus Arena (music only)
        continue-on-error: true
        run: python scraper_veikkausarena.py

      - name: Scrape Tiivistämö (concerts only)
        continue-on-error: true
        run: python scraper_tiivistamo.py

      - name: Scrape Helsingin Jäähalli (concerts only)
        continue-on-error: true
        run: python scraper_jaahalli.py

      - name: Scrape Olympiastadion (music only)
        continue-on-error: true
        run: python scraper_stadion.py

      - name: Scrape Korjaamo (music only)
        continue-on-error: true
        run: python scraper_korjaamo.py

      - name: Scrape Dubrovnik (only gigs whose genres fit)
        continue-on-error: true
        env:
          # Genres are looked up while scraping, to keep only fitting gigs.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python scraper_dubrovnik.py

      - name: Scrape Ääniwalli (only gigs whose genres fit)
        continue-on-error: true
        env:
          # Genres are looked up while scraping, to keep only fitting gigs.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python scraper_aaniwalli.py

      - name: Scrape Krapin Paja, Tuusula (only gigs whose genres fit)
        continue-on-error: true
        env:
          # Genres are looked up while scraping, to keep only fitting gigs.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python scraper_krapinpaja.py

      - name: Scrape Sellosali, Espoo (music only)
        continue-on-error: true
        run: python scraper_sellosali.py

      - name: Tuska festival line-up (weekly, on Mondays)
        continue-on-error: true
        # Festival line-ups change slowly; a manual run always checks too.
        run: |
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scraper_tuska.py
          else
            echo "Not Monday; skipping the weekly Tuska check."
          fi

      - name: Tag genres
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python genres.py

      - name: Stand-up shows for Itse Keksityt Vitsit (/standup)
        # Comedy from the venue scrapes above, Korjaamo's stand-up category
        # and the Helsinki/Espoo event APIs -> data/standup/events.json.
        continue-on-error: true
        run: python standup.py

      - name: Experimental city sites (Tampere, Oulu)
        # Separate data (frontend/data/<city>/events.json); genres share the
        # artist cache. No setlist.fm or Spotify calls for these sites. A
        # broken venue site only gives a warning.
        continue-on-error: true
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          for city in tampere oulu; do
            for f in scraper_${city}_*.py; do
              [ -e "$f" ] || continue
              python "$f" || echo "::warning::$f failed"
            done
            python genres.py --city "$city"
          done

      - name: Daily updates log (new gigs since the last commit)
        # frontend/data/updates.json -> darksuomi.fi/updates
        continue-on-error: true
        run: python changelog.py --mail-file "$RUNNER_TEMP/new-gigs.txt" --markdown-file "$RUNNER_TEMP/new-gigs.md"

      - name: Build expected setlists
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: python setlists.py

      - name: Update Spotify playlists
        # A Spotify problem shouldn't stop the rest of the data from updating.
        continue-on-error: true
        env:
          SPOTIFY_PLAYLIST_CLIENT_ID: ${{ secrets.SPOTIFY_PLAYLIST_CLIENT_ID }}
          SPOTIFY_PLAYLIST_CLIENT_SECRET: ${{ secrets.SPOTIFY_PLAYLIST_CLIENT_SECRET }}
          SPOTIFY_PLAYLIST_REFRESH_TOKEN: ${{ secrets.SPOTIFY_PLAYLIST_REFRESH_TOKEN }}
        run: python playlists.py

      - name: Update band directory links
        # MusicBrainz links (+ Spotify search fallback); not critical.
        # One run covers Helsinki, Tampere and Oulu (data/<city>/bands.json).
        # bands.py stops and saves after 8 minutes by itself (the rest is
        # done the next night); this cap is only for a complete hang.
        continue-on-error: true
        timeout-minutes: 15
        env:
          SPOTIFY_PLAYLIST_CLIENT_ID: ${{ secrets.SPOTIFY_PLAYLIST_CLIENT_ID }}
          SPOTIFY_PLAYLIST_CLIENT_SECRET: ${{ secrets.SPOTIFY_PLAYLIST_CLIENT_SECRET }}
          SPOTIFY_PLAYLIST_REFRESH_TOKEN: ${{ secrets.SPOTIFY_PLAYLIST_REFRESH_TOKEN }}
        run: python bands.py

      - name: Email the new gigs
        # To the owner (secrets SMTP_USERNAME, SMTP_PASSWORD = an app password,
        # MAIL_TO) and to newsletter subscribers (secret BUTTONDOWN_API_KEY).
        # Missing secrets just skip that part.
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python send_updates_email.py "$RUNNER_TEMP/new-gigs.txt" "$RUNNER_TEMP/new-gigs.md"

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Nightly data update $(date +%Y-%m-%d)"
          git push
